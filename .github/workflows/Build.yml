name: Build Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Theos & SDKs
      env:
        THEOS: ${{ github.workspace }}/theos
      run: |
        # Cài đặt Theos trực tiếp (không dùng action bên thứ 3 để tránh lỗi)
        bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
        
        # Tải SDK iOS mới nhất
        mkdir -p "$THEOS/sdks"
        cd "$THEOS/sdks"
        curl -L -o master.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
        unzip -q d master.zip
        mv sdks-master/* .
        rm -rf sdks-master master.zip

    - name: Clean and Build
      env:
        THEOS: ${{ github.workspace }}/theos
      run: |
        # Di chuyển vào thư mục chứa code (có dấu cách nên phải có ngoặc kép)
        cd "intex dylib"
        
        # Xóa ký tự xuống dòng (CRLF) nếu có
        find . -name "control" -exec perl -pi -e 's/\r//g' {} \; || true
        
        # Buildự án
        make clean
        make

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Dylib-Build
        # Tìm file .dylib trong thư mục .theos để upload lên
        path: "intex dylib/.theos/obj/**/*.dylib"
        if-no-files-found: error
